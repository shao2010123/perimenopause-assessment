<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">沃医健康更年期健康服务入口与专题页示意图</title>
  <desc id="desc">示意沃医健康首页插入更年期健康服务专题入口，点击后进入专题页并展示五个更年期产品服务，其中19.9问卷测评为本期上线产品。</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EAF8F7"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF4EC"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E7FAF8"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1F2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #16295A; }
      .section { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #163A5F; }
      .body { font: 400 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #4B5563; }
      .small { font: 400 12px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #6B7280; }
      .tiny { font: 400 10px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #7C8491; }
      .price { font: 700 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #F97316; }
      .pill { font: 700 12px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0F766E; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#F7FAFC"/>
  <text x="60" y="52" class="title">沃医健康更年期健康服务入口与专题页示意图</text>
  <text x="60" y="82" class="body">本期重点开放「¥19.9 问卷测评」，其他产品先做专题展示和后续服务承接。</text>

  <g transform="translate(60 110)" filter="url(#shadow)">
    <rect width="300" height="540" rx="34" fill="#FFFFFF"/>
    <rect x="18" y="18" width="264" height="504" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="42" y="52" class="section">沃医健康首页</text>
    <rect x="42" y="76" width="216" height="34" rx="17" fill="#F3F4F6"/>
    <circle cx="60" cy="93" r="8" fill="none" stroke="#6B7280" stroke-width="3"/>
    <line x1="66" y1="99" x2="73" y2="106" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="99" class="small">搜医院、医生</text>
    <rect x="42" y="128" width="216" height="96" rx="14" fill="url(#hero)" stroke="#D1FAE5"/>
    <text x="62" y="160" class="section">品质医疗服务</text>
    <text x="62" y="184" class="small">在线咨询、预约挂号、医生服务</text>

    <rect x="42" y="242" width="216" height="86" rx="16" fill="#ECFEFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="62" y="271" class="section">更年期健康服务</text>
    <text x="62" y="295" class="small">龚晓明医生团队合作</text>
    <text x="62" y="316" class="pill">19.9测评 · 医生审核</text>
    <rect x="204" y="288" width="38" height="24" rx="12" fill="#0EA5A4"/>
    <text x="213" y="305" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="11" font-weight="700" fill="#FFFFFF">进入</text>

    <g transform="translate(44 356)">
      <rect width="44" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect x="58" width="44" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect x="116" width="44" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect x="174" width="44" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="22" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="10" fill="#6B7280">咨询</text>
      <text x="80" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="10" fill="#6B7280">挂号</text>
      <text x="138" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="10" fill="#6B7280">技术</text>
      <text x="196" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="10" fill="#6B7280">直播</text>
    </g>
    <text x="42" y="462" class="section">最新资讯</text>
    <rect x="42" y="478" width="154" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="42" y="499" width="190" height="10" rx="5" fill="#E5E7EB"/>
  </g>

  <path d="M390 380h56" stroke="#0EA5A4" stroke-width="4" stroke-linecap="round"/>
  <path d="M444 380l-14-10v20z" fill="#0EA5A4"/>

  <g transform="translate(470 84)" filter="url(#shadow)">
    <rect width="370" height="590" rx="34" fill="#FFFFFF"/>
    <rect x="18" y="18" width="334" height="554" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="42" y="58" class="section">更年期健康服务</text>
    <text x="42" y="84" class="small">沃医健康 × 本爱医疗技术服务</text>
    <rect x="42" y="104" width="286" height="82" rx="18" fill="url(#focus)" stroke="#B2F5EA"/>
    <text x="62" y="136" class="section">为30至65岁女性提供阶段评估</text>
    <text x="62" y="160" class="small">问卷测评、检测建议、报告解读、线上咨询路径</text>

    <g transform="translate(42 206)">
      <rect width="286" height="48" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="22" cy="24" r="13" fill="#DBEAFE"/>
      <text x="17" y="29" font-family="Arial" font-size="14" font-weight="700" fill="#1D4ED8">1</text>
      <text x="46" y="28" class="body">科普激活</text>
      <text x="210" y="28" class="small">内容触达</text>

      <rect y="62" width="286" height="78" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
      <circle cx="22" cy="101" r="13" fill="#FFEDD5"/>
      <text x="17" y="106" font-family="Arial" font-size="14" font-weight="700" fill="#EA580C">2</text>
      <text x="46" y="90" class="section">¥19.9 问卷测评</text>
      <text x="46" y="112" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="11" fill="#6B7280">检测建议 · 生活方式建议</text>
      <text x="46" y="130" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="11" fill="#6B7280">医生审核报告</text>
      <rect x="214" y="82" width="58" height="28" rx="14" fill="#F97316"/>
      <text x="224" y="101" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="12" font-weight="700" fill="#FFFFFF">购买</text>

      <rect y="154" width="286" height="48" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="22" cy="178" r="13" fill="#E0F2FE"/>
      <text x="17" y="183" font-family="Arial" font-size="14" font-weight="700" fill="#0284C7">3</text>
      <text x="46" y="182" class="body">¥599 居家激素检测</text>
      <text x="222" y="182" class="small">后续</text>

      <rect y="216" width="286" height="48" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="22" cy="240" r="13" fill="#DCFCE7"/>
      <text x="17" y="245" font-family="Arial" font-size="14" font-weight="700" fill="#16A34A">4</text>
      <text x="46" y="244" class="body">¥69 检测报告解读</text>
      <text x="222" y="244" class="small">后续</text>

      <rect y="278" width="286" height="48" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="22" cy="302" r="13" fill="#FCE7F3"/>
      <text x="17" y="307" font-family="Arial" font-size="14" font-weight="700" fill="#DB2777">5</text>
      <text x="46" y="306" class="body">线上路径：咨询与计划</text>
      <text x="222" y="306" class="small">后续</text>
    </g>
    <text x="42" y="554" class="tiny">由本爱医疗提供技术服务</text>
  </g>

  <path d="M870 380h52" stroke="#0EA5A4" stroke-width="4" stroke-linecap="round"/>
  <path d="M920 380l-14-10v20z" fill="#0EA5A4"/>

  <g transform="translate(950 128)" filter="url(#shadow)">
    <rect width="260" height="460" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="28" y="44" class="section">19.9测评服务流程</text>
    <g transform="translate(28 76)">
      <rect width="204" height="52" rx="14" fill="#ECFEFF" stroke="#A7F3D0"/>
      <text x="18" y="32" class="body">微信内下单支付</text>
      <path d="M102 58v28" stroke="#CBD5E1" stroke-width="2"/>
      <path d="M102 86l-7-7h14z" fill="#CBD5E1"/>

      <rect y="92" width="204" height="52" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
      <text x="18" y="124" class="body">自动推送 H5 问卷链接</text>
      <path d="M102 150v28" stroke="#CBD5E1" stroke-width="2"/>
      <path d="M102 178l-7-7h14z" fill="#CBD5E1"/>

      <rect y="184" width="204" height="52" rx="14" fill="#FFFBEB" stroke="#FED7AA"/>
      <text x="18" y="216" class="body">用户填写并提交</text>
      <path d="M102 242v28" stroke="#CBD5E1" stroke-width="2"/>
      <path d="M102 270l-7-7h14z" fill="#CBD5E1"/>

      <rect y="276" width="204" height="52" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="18" y="308" class="body">后台医生审核报告</text>
      <path d="M102 334v28" stroke="#CBD5E1" stroke-width="2"/>
      <path d="M102 362l-7-7h14z" fill="#CBD5E1"/>

      <rect y="368" width="204" height="52" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="18" y="400" class="body">再次推送报告查看提醒</text>
    </g>
